*{box-sizing:border-box;margin:0}
:root{--deep:#002903;--leaf:#43B14B;--rose:#F11B2A;--silver:#B8B8B8}
html,body{height:100%}
body{font-family:"Blinker",Arial,sans-serif;background:radial-gradient(90% 55% at 50% 115%,#05500d 0%,rgba(0,41,3,0) 70%),#002903;color:#fff;display:grid;place-items:center;overflow:hidden;padding:max(1.25rem,env(safe-area-inset-top)) 1.25rem max(1.25rem,env(safe-area-inset-bottom))}
.petals{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.petals i{position:absolute;top:-8vh;left:var(--x);width:14px;height:20px;background:var(--rose);border-radius:100% 0 100% 0;transform:scale(var(--s)) rotate(calc(var(--r)*1deg));opacity:0;animation:fall 9s linear var(--d) infinite}
.petals i:nth-child(3n){background:var(--leaf)}
@keyframes fall{0%{opacity:0;transform:translate(0,0) rotate(0) scale(var(--s))}10%{opacity:.85}50%{transform:translate(30px,55vh) rotate(180deg) scale(var(--s))}100%{opacity:0;transform:translate(-20px,112vh) rotate(380deg) scale(var(--s))}}
main{position:relative;z-index:1;text-align:center;max-width:36rem;display:grid;gap:1.1rem;justify-items:center}
.logo{width:min(220px,55vw);height:auto;opacity:0;animation:up .8s .1s forwards}
.big{font-size:clamp(6rem,26vw,11rem);font-weight:700;line-height:.9;letter-spacing:.02em;display:flex;align-items:center;justify-content:center;gap:.04em;opacity:0;animation:up .8s .25s forwards}
.big .o{width:.86em;height:.86em;display:inline-block;animation:spin 14s linear infinite}
.rose{width:100%;height:100%;display:block}

@keyframes draw{to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.tick{width:120px;height:120px;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tick .ring{stroke:var(--leaf);stroke-width:5;stroke-dasharray:340;stroke-dashoffset:340;animation:draw 1.1s .3s ease forwards;transform-origin:center;transform:rotate(-90deg)}
.tick .chk{stroke:#fff;stroke-width:8;stroke-dasharray:90;stroke-dashoffset:90;animation:draw .6s 1.2s ease forwards}
.tick{filter:drop-shadow(0 0 18px rgba(67,177,75,.5))}
h1{font-size:clamp(1.9rem,6vw,2.8rem);font-weight:600;opacity:0;animation:up .7s .5s forwards}
h1 span{color:var(--leaf)}
p{color:#d4e5d5;font-size:1.1rem;line-height:1.55;opacity:0;animation:up .7s .7s forwards}
.row{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center;margin-top:.5rem;opacity:0;animation:up .7s .9s forwards}
.btn{display:inline-flex;align-items:center;min-height:3.1rem;padding:0 1.5rem;font:600 1rem "Blinker",Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:#fff;border:1px solid var(--silver);transition:transform .2s,background .2s}
.btn--rose{background:var(--rose);border-color:var(--rose)}
.btn:hover{transform:translateY(-2px);background:#fff;color:var(--deep)}
.btn:focus-visible{outline:3px solid var(--leaf);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}.petals{display:none}}
</style></head>
